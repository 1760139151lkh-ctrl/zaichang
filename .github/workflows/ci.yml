name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: npm install --global npm@11.16.0
      - run: python -m pip install uv==0.11.29
      - run: npm ci
      - run: npm run setup
      - run: npm run build
      - run: npm test
      - run: npm run test:hermes
      - run: node scripts/desktop-smoke.mjs
        if: runner.os == 'Windows'
      - run: node scripts/pdf-smoke.mjs
        if: runner.os == 'Windows'
      - run: node scripts/check-review.mjs

