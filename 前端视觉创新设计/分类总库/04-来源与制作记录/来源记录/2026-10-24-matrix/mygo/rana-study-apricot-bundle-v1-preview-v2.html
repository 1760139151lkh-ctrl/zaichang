<h1>Rana study 暖杏 · 椅背窄缝补源</h1>
<p>隔离静态观察；沿用原 PNG。小区域原母 RGB 固定在房间坐标，位于旧影层与旧人物之间；含椅背、椅面及相邻黑衣摆和白短裤边缘。人物隐藏、换姿态或母图未核实时必须一起移除。未接入产品。</p>
